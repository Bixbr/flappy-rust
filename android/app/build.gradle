plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flappy.rust'
    compileSdk 34

    defaultConfig {
        applicationId "com.flappy.rust"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
